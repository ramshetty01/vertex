<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pilot Dashboard — Job Bot</title>
    <style>
      :root {
        --bg: #f6f7f9; --card: #fff; --ink: #1a1a1a; --muted: #6b7280;
        --line: #e5e7eb; --accent: #0b5cff; --ok: #0a7d33; --warn: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1115; --card: #171a21; --ink: #e8eaed; --muted: #9aa0ab; --line: #262b34; --accent: #4f8cff; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
      header { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      h1 { font-size: 17px; margin: 0; }
      .grow { flex: 1; }
      input { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 260px; max-width: 50vw; }
      button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
      .muted { color: var(--muted); font-size: 12px; }
      main { padding: 22px; max-width: 1000px; margin: 0 auto; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
      .tile .n { font-size: 30px; font-weight: 700; }
      .tile .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
      .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 12px; }
      .bar { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
      .bar .name { width: 190px; color: var(--muted); }
      .bar .track { flex: 1; height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
      .bar .fill { height: 100%; background: var(--accent); }
      .bar .v { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { color: var(--muted); font-weight: 600; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--line); }
      .yes { color: var(--ok); font-weight: 600; }
      #err { color: #c1121f; font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <h1>📊 Pilot Dashboard</h1>
      <span class="muted" id="clock"></span>
      <span class="grow"></span>
      <input id="token" type="password" placeholder="Admin token" autocomplete="off" />
      <button id="go">Connect</button>
      <label class="muted"><input type="checkbox" id="auto" checked style="width:auto" /> auto-refresh 10s</label>
    </header>
    <main>
      <div id="err"></div>
      <div class="tiles" id="tiles"></div>
      <div class="card"><h2>Users by state</h2><div id="states"></div></div>
      <div class="card"><h2>Users</h2><div class="scroll"><table id="tbl"><thead><tr>
        <th>ID</th><th>State</th><th>Profile</th><th>Paid</th><th>Matches</th><th>Applications</th>
      </tr></thead><tbody></tbody></table></div></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const tokenEl = $("token"), errEl = $("err");
      let timer = null;

      // Persist the token in this browser only (localStorage), so a refresh keeps it.
      tokenEl.value = localStorage.getItem("adminToken") || "";

      function tile(n, l) { return `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

      async function load() {
        const tok = tokenEl.value.trim();
        if (!tok) { errEl.textContent = "Enter the admin token."; return; }
        localStorage.setItem("adminToken", tok);
        try {
          const res = await fetch("/admin/stats", { headers: { "X-Admin-Token": tok } });
          if (res.status === 403) { errEl.textContent = "Forbidden — wrong token."; return; }
          if (res.status === 503) { errEl.textContent = "ADMIN_TOKEN not set on the server."; return; }
          if (!res.ok) { errEl.textContent = "Error " + res.status; return; }
          errEl.textContent = "";
          render(await res.json());
          $("clock").textContent = "updated " + new Date().toLocaleTimeString();
        } catch (e) { errEl.textContent = "Network error: " + e.message; }
      }

      function render(d) {
        $("tiles").innerHTML =
          tile(d.users, "Users") +
          tile(d.withProfile, "With profile") +
          tile(d.paid, "Paid") +
          tile(d.applications.total, "Applications") +
          tile(d.applications.submitted, "Submitted");

        const states = Object.entries(d.byState || {}).sort((a, b) => b[1] - a[1]);
        const max = Math.max(1, ...states.map(([, v]) => v));
        $("states").innerHTML = states.length
          ? states.map(([s, v]) =>
              `<div class="bar"><div class="name">${s}</div><div class="track"><div class="fill" style="width:${(v / max) * 100}%"></div></div><div class="v">${v}</div></div>`
            ).join("")
          : '<span class="muted">No users yet.</span>';

        const rows = (d.detail || []).map((u) =>
          `<tr><td>${u.id}</td><td><span class="pill">${u.state}</span></td>` +
          `<td>${u.hasProfile ? '<span class="yes">✓</span>' : "—"}</td>` +
          `<td>${u.paid ? '<span class="yes">✓</span>' : "—"}</td>` +
          `<td>${u.matches}</td><td>${u.applications}</td></tr>`
        ).join("");
        $("tbl").querySelector("tbody").innerHTML = rows || '<tr><td colspan="6" class="muted">No users.</td></tr>';
      }

      function setAuto() {
        if (timer) { clearInterval(timer); timer = null; }
        if ($("auto").checked) timer = setInterval(load, 10000);
      }

      $("go").addEventListener("click", load);
      tokenEl.addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
      $("auto").addEventListener("change", setAuto);
      if (tokenEl.value) load();
      setAuto();
    </script>
  </body>
</html>
